[package]
name = "collateral"
version = "0.1.0"
description = "Argonath: PQ-hardened stablecoin card-collateral vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "collateral"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
vulnerable = []
pq = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
pq-verify = { path = "../../crates/pq-verify" }
mldsa-verify = { path = "../../crates/mldsa-verify" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
