[package]
name = "collateral"
version = "0.1.0"
description = "PQ Solana Collateral Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "collateral"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
vulnerable = []
pq = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
pq-verify = { path = "../../crates/pq-verify" }
